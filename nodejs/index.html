<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIP-8 Emulator</title>
    <style>
        #canvas {
            border: 1px solid black;
        }
        #controls {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div id="controls">
        <input type="file" id="filePicker" />
        <button id="start">Start</button>
    </div>
    <canvas id="canvas" width="640" height="320"></canvas>
    <script type="module">
        import { CPU } from './cpu.js'; // Adjust the path if necessary

        // Initialize canvas and context
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const scale = 10; // Scale factor for each pixel
        // context.scale(scale, scale);

        // Initialize the CPU
        const cpu = new CPU();

        // Function to update the canvas with the display data
        function updateCanvas() {
            const display = cpu.getDisplay();
            const cols = 64;
            const rows = 32;
            
            // for(let i=0; i < display.length; i++) {
            //     const value = display[i];`
            //     const col = display.length % cols;
            //     const row = Math.floor(display.length / rows);
            //     context.fillStyle = value === 1 ? 'black' : 'black'; // Set color based on value
            //     context.fillRect(col, row, 1, 1); // Draw the rectangle (scaled)
            // }
            for(let row=0; row<rows; row++) {
                for(let col =0; col<cols; col++) {
                    const value = display[col + row * cols];
                    context.fillStyle = value === 1 ? 'black' : 'white';
                    context.fillRect(col * scale, row * scale, scale, scale);
                }
            }
        }

        function updateCanvasNew() {
            const display = cpu.getDisplay();
            const cols = 64;
            const rows = 32;
            // Clears the display every render cycle. Typical for a render loop.
            context.clearRect(0, 0, canvas.width, canvas.height);
        
            // Loop through our display array
            for (let i = 0; i < cols * rows; i++) {
                // Grabs the x position of the pixel based off of `i`
                let x = (i % cols) * scale;

                // Grabs the y position of the pixel based off of `i`
                let y = Math.floor(i / cols) * scale;

                // If the value at this.display[i] == 1, then draw a pixel.
                if (display[i]) {
                    // Set the pixel color to black
                    context.fillStyle = '#000';

                    // Place a pixel at position (x, y) with a width and height of scale
                    context.fillRect(x, y, scale, scale);
                }
            }
        }

        // Function to load and start the ROM
        function loadROM(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const arrayBuffer = event.target.result;
                const bytes = new Uint8Array(arrayBuffer);

                // Reset the CPU
                cpu.reset();

                // Load the ROM into memory
                for (let i = 0; i < bytes.length; i++) {
                    cpu.memory.write(0x200 + i, bytes[i]);
                }

                // Start the CPU
                setInterval(() => {
                    cpu.step();
                    updateCanvas();
                    cpu.tickTimers();
                }, 16); // 60 Hz (16 ms per frame)
            };
            reader.readAsArrayBuffer(file);
        }

        // Set up event listeners
        document.getElementById('filePicker').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                loadROM(file);
            }
        });

        document.getElementById('start').addEventListener('click', () => {
            // Start the CPU emulation
            setInterval(() => {
                cpu.step();
                updateCanvas();
                cpu.tickTimers();
            }, 16); // 60 Hz (16 ms per frame)
        });
    </script>
</body>
</html>
